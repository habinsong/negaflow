name: Windows CI

# macOS 쪽 ci.yml 과 분리한 이유는 경로 필터다. Sources/ 만 건드리는 PR 에서 Windows 잡을
# 돌릴 이유가 없고, 워크플로가 나뉘어 있으면 트리거와 예산을 따로 조정할 수 있다.
# 같은 검사를 로컬에서 한 번에 돌리는 입구는 Negaflow.Windows/scripts/ci-gate.ps1 이다.
on:
  pull_request:
    paths:
      - 'Negaflow.Windows/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths:
      - 'Negaflow.Windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 실제 계산은 전부 합쳐 100초 남짓이다. 느려지는 건 컴파일이 아니라 설계이므로 잡을 나란히
# 두고 PR 에서는 Release 만 돌린다. 산정 근거는 docs/progress/windows-ci-plan.md 에 있다.
jobs:
  native:
    name: Native build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Negaflow.Windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # 러너 이미지가 바뀌면 가장 먼저 깨지는 지점이라 버전을 남긴다. CMakePresets.json 은
      # generator 를 "Visual Studio 18 2026" 으로 고정하며, windows-2025 는 2026년 6월부터
      # Visual Studio 2026 을 담고 있다.
      - name: Toolchain
        run: |
          cmake --version
          ctest --version
      - name: Configure
        run: cmake --preset x64-release
      - name: Build
        run: cmake --build --preset x64-release
      - name: Test
        run: ctest --preset x64-release --output-on-failure

  managed:
    name: Managed build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Negaflow.Windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # global.json 이 10.0.302 를 고정하고 windows-2025 이미지가 같은 SDK 를 담고 있어
      # setup-dotnet 을 쓰지 않는다. 이미지에서 사라지면 이 단계 출력과 함께 global.json
      # 오류로 분명하게 실패한다.
      - name: Toolchain
        run: dotnet --list-sdks
      - name: Restore
        run: dotnet restore Negaflow.Windows.slnx -p:Platform=x64 --locked-mode
      - name: Build
        run: dotnet build Negaflow.Windows.slnx -c Release -p:Platform=x64 --no-restore --nologo
      # 테스트는 assertion 수를 담은 JSON 한 줄을 내고 실패 시 0 이 아닌 코드로 끝난다.
      - name: Catalog unit tests
        run: ./out/build/managed/Negaflow.Catalog.UnitTests/Release/net10.0/Negaflow.Catalog.UnitTests.exe
      - name: Shell unit tests
        run: ./out/build/managed/Negaflow.Shell.UnitTests/Release/net10.0/Negaflow.Shell.UnitTests.exe

  # ARM64 는 교차 빌드만 확인한다. x64 호스트에서 실행할 수 없으므로 통과를 runtime 검증으로
  # 읽으면 안 된다. 매 PR 마다 돌릴 가치가 낮아 main push 와 수동 실행에서만 돈다.
  arm64-cross:
    name: ARM64 cross build
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Negaflow.Windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Configure
        run: cmake --preset arm64-release
      - name: Build native
        run: cmake --build --preset arm64-release
      - name: Restore
        run: dotnet restore Negaflow.Windows.slnx -p:Platform=ARM64 --locked-mode
      - name: Build managed
        run: dotnet build Negaflow.Windows.slnx -c Release -p:Platform=ARM64 --no-restore --nologo

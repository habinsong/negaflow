name: Windows CI

# macOS 쪽 ci.yml 과 분리한 이유는 경로 필터다. negaflow-mac/Sources/ 만 건드리는 PR 에서 Windows 잡을
# 돌릴 이유가 없고, 워크플로가 나뉘어 있으면 트리거와 예산을 따로 조정할 수 있다.
# 같은 검사를 로컬에서 한 번에 돌리는 입구는 negaflow-windows/scripts/ci-gate.ps1 이다.
on:
  pull_request:
    paths:
      - 'negaflow-windows/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths:
      - 'negaflow-windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 실제 계산은 전부 합쳐 100초 남짓이다. 느려지는 건 컴파일이 아니라 설계이므로 잡을 나란히
# 두고 PR 에서는 Release 만 돌린다. 산정 근거는 docs/progress/windows-ci-plan.md 에 있다.
jobs:
  native:
    name: Native build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: negaflow-windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # 이 CTest 두 개는 LFS TIFF의 실제 IFD와 RGB16 픽셀을 읽는다. 전체 golden 묶음 대신
      # 해당 fixture만 hydrate해 네이티브 잡의 다운로드와 실패 원인을 제한한다.
      - name: Fetch native golden fixtures
        run: git lfs pull --include="docs/verification/macos-golden/task6-metadata-policy/**,docs/verification/macos-golden/task9-bw-slide/**"
      # 러너 이미지가 바뀌면 가장 먼저 깨지는 지점이라 버전을 남긴다. CMakePresets.json 은
      # generator 를 "Visual Studio 18 2026" 으로 고정하며, windows-2025 는 2026년 6월부터
      # Visual Studio 2026 을 담고 있다.
      - name: Toolchain
        run: |
          cmake --version
          ctest --version
      - name: Configure
        run: cmake --preset x64-release
      - name: Build
        run: cmake --build --preset x64-release
      - name: Test
        run: ctest --preset x64-release --output-on-failure

  managed:
    name: Managed build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: negaflow-windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # global.json 이 10.0.302 를 고정하고 windows-2025 이미지가 같은 SDK 를 담고 있어
      # setup-dotnet 을 쓰지 않는다. 이미지에서 사라지면 이 단계 출력과 함께 global.json
      # 오류로 분명하게 실패한다.
      - name: Toolchain
        run: dotnet --list-sdks
      - name: Restore
        run: dotnet restore Negaflow.Windows.slnx -p:Platform=x64 --locked-mode
      - name: Build
        run: dotnet build Negaflow.Windows.slnx -c Release -p:Platform=x64 --no-restore --nologo
      # 테스트는 assertion 수를 담은 JSON 한 줄을 내고 실패 시 0 이 아닌 코드로 끝난다.
      #
      # 출력 경로를 손으로 쓰지 않는다. Directory.Build.props 가 BaseOutputPath 를
      # 프로젝트별로 두는데, 그 아래 경로는 프로젝트의 Platform 에 따라 갈린다 —
      # AnyCPU 는 `<Configuration>/`, x64 는 `x64/<Configuration>/` 이다. 손으로 쓴
      # 경로는 Shell 쪽에서 실제로 어긋나 있었다. `dotnet run` 이 같은 규칙으로
      # 풀어 주고, scripts/test-managed.ps1 과도 방식이 같아진다.
      - name: Catalog unit tests
        run: dotnet run --project tests/Catalog.UnitTests/Negaflow.Catalog.UnitTests.csproj -c Release -p:Platform=AnyCPU --no-build --no-restore
      - name: Shell unit tests
        run: dotnet run --project tests/Shell.UnitTests/Negaflow.Shell.UnitTests.csproj -c Release -p:Platform=x64 --no-build --no-restore

  # 배포물은 일반 build 출력과 다르다. self-contained publish가 App Runtime·.NET을
  # 빠뜨리지 않는지, NSIS가 실제 user-scope 설치/제거를 끝내는지를 매 변경에서 확인한다.
  installer-smoke:
    name: x64 installer smoke
    needs: [native, managed]
    runs-on: windows-2025
    # 이 잡은 설치 프로그램을 **처음부터** 짓고(네이티브 포함, 실측 14분 28초) 그것을 무인
    # 설치·실행·제거까지 합니다. 25 분으로는 빌드가 끝나면 검증에 10 분밖에 남지 않아,
    # 등록이 조금만 늦어도 잡이 통째로 취소되고 무엇이 늦었는지는 남지 않습니다.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: negaflow-windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Install branding image tooling
        shell: pwsh
        # 설치 화면 비트맵은 앱 아이콘에서 굽는다. 저장소에 BMP 를 두지 않는 대가다.
        run: py -3 -m pip install --quiet --disable-pip-version-check pillow
      - name: Build installer
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1
          -Architecture x64
      - name: Verify silent install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\out\release\win-x64\negaflow-*-x64-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer artifact was not created.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-installer.ps1 -InstallerPath $installer.FullName
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Negaflow-x64-installer-${{ github.sha }}
          path: |
            negaflow-windows/out/release/win-x64/negaflow-*-x64-setup.exe
            negaflow-windows/out/release/win-x64/negaflow-*-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  # ARM64 는 교차 빌드만 확인한다. x64 호스트에서 실행할 수 없으므로 통과를 runtime 검증으로
  # 읽으면 안 된다. 매 PR 마다 돌릴 가치가 낮아 main push 와 수동 실행에서만 돈다.
  arm64-cross:
    name: ARM64 cross build
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: negaflow-windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Configure
        run: cmake --preset arm64-release
      - name: Build native
        run: cmake --build --preset arm64-release
      - name: Restore
        run: dotnet restore Negaflow.Windows.slnx -p:Platform=ARM64 --locked-mode
      - name: Build managed
        run: dotnet build Negaflow.Windows.slnx -c Release -p:Platform=ARM64 --no-restore --nologo

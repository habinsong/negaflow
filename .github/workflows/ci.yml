name: CI

# 태그는 main에서 이미 초록인 커밋에만 붙는 이름표라 push 트리거에서 뺐다. 같은 커밋을
# 두 번 검증하는 데 26분이 들었다. 태그 시점에 릴리즈 산출물을 다시 확인하고 싶으면
# 그 태그를 ref로 골라 이 워크플로를 workflow_dispatch 로 돌린다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 세 검사를 한 잡에 직렬로 넣으면 plist 오타도 30분 뒤에나 보인다. 서로 결과를
# 주고받지 않으므로 나란히 돌린다 — static 은 1분 안에, 전체는 가장 긴 잡 시간에 끝난다.
jobs:
  static:
    name: Contracts, boundaries, and provenance
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify static contracts
        run: bash negaflow-mac/scripts/ci/verify-static.sh

  swift:
    name: Swift build and strict-concurrency tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 32
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Build and test under strict concurrency
        run: bash negaflow-mac/scripts/ci/build-swift.sh
      - name: Emit Windows Film Emulation golden
        if: github.event_name == 'workflow_dispatch'
        env:
          NEGAFLOW_WINDOWS_FILM_GOLDEN_OUTPUT: ${{ github.workspace }}/negaflow-windows/out/macos-golden/film-emulation-core-image-v1.json
        run: |
          BASELINE_COMMIT="$(plutil -extract source.mac_commit raw negaflow-windows/baseline/bootstrap-manifest.json)"
          git diff --exit-code "$BASELINE_COMMIT" -- \
            negaflow-mac/Sources/Chromabase/Adjustments/FilmEmulation.swift \
            negaflow-mac/Sources/Chromabase/Adjustments/FilmEmulationProfile.swift \
            negaflow-mac/Sources/Chromabase/Adjustments/FilmEmulationProfile+Slide.swift \
            negaflow-mac/Sources/Chromabase/Adjustments/FilmEmulationProfile+Negative.swift
          swift test \
            -Xswiftc -warn-concurrency \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            --filter WindowsFilmEmulationGoldenTests/testEmitGoldenWhenRequested
      - name: Upload Windows Film Emulation golden
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-windows-film-golden-${{ github.sha }}
          path: negaflow-windows/out/macos-golden/film-emulation-core-image-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Emit ColorSync ICM parity reference
        if: github.event_name == 'workflow_dispatch'
        env:
          NEGAFLOW_COLORSYNC_PARITY_OUTPUT: ${{ github.workspace }}/negaflow-windows/out/macos-golden/colorsync-icm-parity-v1.json
          NEGAFLOW_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          swift test \
            -Xswiftc -warn-concurrency \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            --filter ColorSyncIcmParityGoldenTests/testEmitParityGoldenWhenRequested
          # The checked-in reference must match what this runner produces. A drift here
          # means ColorSync changed behaviour and the Windows comparison is now unanchored.
          python3 - <<'PY'
          import json, sys
          committed = json.load(open("negaflow-windows/baseline/colorsync-icm-parity-v1.json"))
          emitted = json.load(open("negaflow-windows/out/macos-golden/colorsync-icm-parity-v1.json"))
          if committed["profile"]["sha256"] != emitted["profile"]["sha256"]:
              sys.exit("synthesised profile bytes drifted from the committed reference")
          if [p["name"] for p in committed["patches"]] != [p["name"] for p in emitted["patches"]]:
              sys.exit("patch set changed without refreshing the committed reference")
          worst = max(
              abs(a - b)
              for x, y in zip(committed["patches"], emitted["patches"])
              for a, b in zip(x["out"], y["out"])
          )
          print(f"colorsync parity drift={worst:.3e}")
          if worst > 1e-6:
              sys.exit(f"ColorSync output drifted from the committed reference by {worst:.3e}")
          PY
      - name: Upload ColorSync ICM parity reference
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-colorsync-parity-${{ github.sha }}
          path: negaflow-windows/out/macos-golden/colorsync-icm-parity-v1.json
          if-no-files-found: error
          retention-days: 14

  gui:
    name: GUI end-to-end test build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      - name: Build GUI test bundle
        run: bash negaflow-mac/scripts/ci/build-gui-tests.sh
      - name: Upload GUI test build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-GUI-test-build-${{ github.sha }}
          path: build/NegaflowE2E.xcresult
          if-no-files-found: warn
          retention-days: 14

  release-smoke:
    name: Unsigned release artifact smoke
    needs: [static, swift, gui]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Build local release artifacts
        env:
          NEGAFLOW_RELEASE_MODE: local
        run: bash negaflow-mac/scripts/build-release.sh
      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-release-smoke-${{ github.sha }}
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

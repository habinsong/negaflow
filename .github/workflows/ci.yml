name: CI

# 태그는 main에서 이미 초록인 커밋에만 붙는 이름표라 push 트리거에서 뺐다. 같은 커밋을
# 두 번 검증하는 데 26분이 들었다. 태그 시점에 릴리즈 산출물을 다시 확인하고 싶으면
# 그 태그를 ref로 골라 이 워크플로를 workflow_dispatch 로 돌린다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 세 검사를 한 잡에 직렬로 넣으면 plist 오타도 30분 뒤에나 보인다. 서로 결과를
# 주고받지 않으므로 나란히 돌린다 — static 은 1분 안에, 전체는 가장 긴 잡 시간에 끝난다.
jobs:
  static:
    name: Contracts, boundaries, and provenance
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify static contracts
        run: bash scripts/ci/verify-static.sh

  swift:
    name: Swift build and strict-concurrency tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Build and test under strict concurrency
        run: bash scripts/ci/build-swift.sh

  gui:
    name: GUI end-to-end tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      - name: Run GUI tests
        env:
          NEGAFLOW_CI_GUI_RUN: '1'
        run: bash scripts/ci/build-gui-tests.sh
      - name: Upload GUI test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-GUI-tests-${{ github.sha }}
          path: build/NegaflowE2E.xcresult
          if-no-files-found: warn
          retention-days: 14

  release-smoke:
    name: Unsigned release artifact smoke
    needs: [static, swift, gui]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Build local release artifacts
        env:
          NEGAFLOW_RELEASE_MODE: local
        run: bash scripts/build-release.sh
      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-release-smoke-${{ github.sha }}
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

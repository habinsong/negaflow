name: NegaflowE2E
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  NegaflowPackage:
    path: ${NEGAFLOW_PACKAGE_ROOT}
targets:
  # macOS XCTest writes TEST_TARGET_NAME directly into UITargetAppPath. Matching the
  # target name to the wrapper name keeps the generated path at negaflowApp.app.
  negaflowApp.app:
    type: application
    platform: macOS
    sources:
      - path: ${NEGAFLOW_PACKAGE_ROOT}/Sources/negaflowApp
        excludes:
          - Resources/**/*.stringsdict
    dependencies:
      - package: NegaflowPackage
        product: ScannerKit
      - package: NegaflowPackage
        product: Chromabase
      - sdk: AppKit.framework
      - sdk: ImageCaptureCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.negaflow.app.e2e
        PRODUCT_NAME: negaflowApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ${NEGAFLOW_PACKAGE_ROOT}/Config/negaflowApp-Info.plist
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
  negaflowAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ${NEGAFLOW_PACKAGE_ROOT}/Tests/negaflowAppUITests
    dependencies:
      - target: negaflowApp.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.negaflow.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  negaflowAppE2E:
    build:
      targets:
        negaflowApp.app: all
        negaflowAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: negaflowAppUITests
          parallelizable: false
          randomExecutionOrder: false
